
image: alpine:latest

stages:
  - build
  - test
  - deploy

build-job:
  stage: build

  script:
    - chmod +x scripts/build.sh
    - sh scripts/build.sh

  artifacts:
    paths:
      - public/

test-job:
  stage: test

  script:
    - chmod +x scripts/test.sh
    - sh scripts/test.sh

deploy-job:
  stage: deploy

  before_script:
    - apk add --no-cache openssh

  script:
    - chmod +x scripts/deploy.sh
    - sh scripts/deploy.sh




