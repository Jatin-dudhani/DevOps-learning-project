image: alpine:latest

stages:
  - build
  - test
  - deploy

build-job:
  stage: build
  script:
    - echo "Building website..."
    - mkdir public
    - cp index.html public/
    - cp style.css public/
    - cp script.js public/

  artifacts:
    paths:
      - public/

test-job:
  stage: test
  script:
    - echo "Testing website files..."
    - test -f public/index.html
    - test -f public/style.css
    - test -f public/script.js
    - echo "All tests passed"

deploy-job:
  stage: deploy

  dependencies:
    - build-job

  before_script:
    - apk add --no-cache openssh

  script:
    - mkdir -p ~/.ssh

    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa

    - chmod 600 ~/.ssh/id_rsa

    - echo "HOST=$EC2_HOST"
    
    - echo "USER=$EC2_USER"

    - apk add --no-cache netcat-openbsd
    
    - nc -vz $EC2_HOST 22

    - scp -r public/* $EC2_USER@$EC2_HOST:/tmp/

    - ssh $EC2_USER@$EC2_HOST "sudo cp -r /tmp/* /var/www/html/"




