
image: alpine:latest

stages:
  - build
  - test
  - docker
  - deploy

build-job:
  stage: build

  script:
    - chmod +x scripts/build.sh
    - sh scripts/build.sh

  artifacts:
    paths:
      - public/

test-job:
  stage: test

  script:
    - chmod +x scripts/test.sh
    - sh scripts/test.sh

docker-build:
  stage: docker

  dependencies:
    - build-job

  image: docker:latest

  services:
    - docker:dind

  variables:
    DOCKER_TLS_CERTDIR: ""

  script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"

    - docker build -t $DOCKER_USERNAME/my-static-site:latest .

    - docker push $DOCKER_USERNAME/my-static-site:latest
    
deploy-job:
  stage: deploy

  before_script:
    - apk add --no-cache openssh

  script:
    - chmod +x scripts/deploy.sh
    - sh scripts/deploy.sh




